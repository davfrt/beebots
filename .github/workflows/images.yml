# Builds the three images that docker-compose.yml pulls, for amd64 (Hostinger VPS) and arm64.
# A release tag (v2026.09.25) publishes :latest and :2026.09.25, which is what installs run; the dashboard shows
# "Update available" when a newer release exists. A push to main only publishes :edge, so installs never get
# unreleased code.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: echo "source_revision=$GITHUB_SHA"
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm test:launch

  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      RELEASE: smoke
      ENGINE_IMAGE: beebots-engine:local
      WEB_IMAGE: beebots-web:local
      BACKUP_IMAGE: beebots-backup:local
      PUBLIC_DOMAIN: :80
    steps:
      - uses: actions/checkout@v4
      - run: echo "source_revision=$GITHUB_SHA"
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
      - run: curl --fail --retry 20 --retry-connrefused http://127.0.0.1/health | grep -F '"setup":true'
      - run: curl --fail http://127.0.0.1/
      - run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1/snapshot)" = 405
      - run: docker compose exec -T engine id -u | grep -x 1000
      - run: docker compose exec -T web id -u | grep -x 1000
      - run: docker compose exec -T backup id -u | grep -x 1000
      - run: docker compose exec -T engine node -e "const d=new (require('node:sqlite').DatabaseSync)('/data/bees-dry.sqlite');d.exec(\"CREATE TABLE meta(key TEXT PRIMARY KEY,value TEXT); INSERT INTO meta VALUES ('mode','dry')\");d.close();require('node:fs').writeFileSync('/data/settings.json', JSON.stringify({version:1,jevKey:'12345678',acceptedRiskAt:0,createdAt:0,bees:[{name:'One',style:'bizzy'},{name:'Two',style:'breezy'},{name:'Three',style:'boozy'}]}))"
      - run: docker compose exec -T backup sh -c "mkdir -p /work/bin /work/offhost /work/restored && printf '#!/bin/sh\\nexit 0\\n' >/work/bin/ssh && printf '#!/bin/sh\\nfor x; do case \"\$x\" in /work/*.age) cp \"\$x\" /work/offhost/;; esac; done\\n' >/work/bin/scp && chmod 755 /work/bin/ssh /work/bin/scp && age-keygen -o /work/key.txt && : >/work/known && BACKUP_ONCE=true BACKUP_AGE_RECIPIENT=\"\$(grep '^# public key:' /work/key.txt | cut -d' ' -f4)\" BACKUP_SSH_TARGET=backup@mock:/archive BACKUP_SSH_KEY_PATH=/work/key.txt BACKUP_SSH_KNOWN_HOSTS_PATH=/work/known PATH=/work/bin:\$PATH backup.sh && grep -F '\"ok\":true' /status/status.json && restore.sh \"\$(find /work/offhost -name '*.age')\" /work/key.txt /work/restored"
      - run: docker compose exec -T backup tar -C /work/restored -cf - . | docker compose exec -T engine tar -C /data -xf -
      - run: docker compose stop engine && timeout 10 docker run --rm --network none --volumes-from "$(docker compose ps -q --all engine)" -e DB_PATH=/data/bees-{mode}.sqlite -e SETTINGS_PATH=/data/settings.json -e ENGINE_BIND=0.0.0.0 -e UPDATE_CHECK=false beebots-engine:local 2>&1 | grep -F 'engine http listening'
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  build:
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: engine, context: ., file: Dockerfile }
          - { name: web, context: ., file: deploy/web.Dockerfile }
          - { name: backup, context: deploy, file: deploy/backup.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: tags
        env:
          IMG: ghcr.io/${{ steps.owner.outputs.lc }}/beebots-${{ matrix.name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s:latest\n%s:%s\n%s:%s\nEOF\n' "$IMG" "$IMG" "$v" "$IMG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\n%s:edge\n%s:%s\nEOF\n' "$IMG" "$IMG" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - run: |
          release="$GITHUB_REF_NAME"
          for name in engine web backup; do
            image="ghcr.io/${{ steps.owner.outputs.lc }}/beebots-$name"
            digest="$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{.Digest}}')"
            printf '%s_IMAGE=%s@%s\n' "${name^^}" "$image" "$digest" >> release.env
          done
          printf 'RELEASE=%s\n' "$release" >> release.env
      - uses: softprops/action-gh-release@v2
        with:
          files: release.env
